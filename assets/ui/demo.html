<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MODEUS UI Asset Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100c12;color:#f4eee9;font-family:system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:18px}h1{color:#f03740;letter-spacing:.1em;font-size:22px}.panel{border:28px solid transparent;border-image:url("hud_frame.svg") 40 fill / 28px / 0 stretch;background:#100c12;padding:4px 8px;margin:12px 0}.tag{display:inline-block;background:#f03740;color:#100c12;font-weight:900;padding:4px 12px;margin-bottom:8px}.panel p{margin:5px 0 10px;font-size:18px}.muted{color:#b7a7ad}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.meter{height:30px;position:relative;background:#251d26 url("progress_track.svg") center/100% 100% no-repeat;overflow:hidden;margin:8px 0 14px}.fill{position:absolute;left:6px;top:7px;bottom:7px;background:#f03740;width:33%}.fill.time{background:#e6a33b;width:70%}.slots{display:flex;gap:6px}.slots img{width:36px;height:36px}.btn{display:block;width:100%;min-height:64px;background: url("button_idle.svg") center/100% 100% no-repeat;border:0;color:white;font-weight:900;font-size:22px;touch-action:manipulation}.btn:active{background-image:url("button_pressed.svg");transform:translateY(4px)}small{color:#b7a7ad}</style>
<div class="wrap"><h1>MODEUS 調教</h1><div class="panel"><span class="tag">MODEUS</span><p>「別急，先把規則記清楚。」</p></div><div class="row"><div class="panel" style="flex:1;text-align:center"><small>BPM</small><p style="font-size:34px;color:#f03740;font-weight:900">90</p></div><div class="panel" style="flex:1"><small>墮落試煉 0 / 6</small><div class="slots"><img src="trial_slot_empty.svg" alt="未完成"><img src="trial_slot_empty.svg" alt="未完成"><img src="trial_slot_empty.svg" alt="未完成"><img src="trial_slot_empty.svg" alt="未完成"><img src="trial_slot_empty.svg" alt="未完成"><img src="trial_slot_empty.svg" alt="未完成"></div></div></div><div class="panel"><span class="tag">當前指令</span><p><strong>指令名稱由遊戲填入</strong></p><p class="muted">完整說明由原本遊戲狀態動態填入。</p></div><div class="row"><b>淫蕩度</b><b>33%</b></div><div class="meter"><div class="fill"></div></div><div class="row"><b>本條倒計時</b><b>14</b></div><div class="meter"><div class="fill time"></div></div><button class="btn">投降</button><p><small>這是純介面預覽。示例數字並未連接遊戲邏輯。</small></p></div></html>
